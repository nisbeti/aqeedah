<p>‏قَالَ: مَا لَمْ ‏ ‏تَنَلْهُ خِفَافُ الْإِبِلِ، فَأَقَرَّ بِهِ ‏قُتَيْبَةُ، ‏وَقَالَ: نَعَمْ» فالماء العد الذي لا ينقطع، والملح الذي لا ينفد، والنفط والمعادن إن تحقق فيها وصف الماء العد لم يجز أن يتملكها الأفراد.</p>

<p>إذن، ثبت أن العلم لا يستطيع أن يعطي التصور الصحيح للسلوك الصحيح، ولا أن يعين &quot;الخير أو الشر&quot;، ولا الثواب والعقاب، فلا يصلح أساساً لبحث التشريع.</p>

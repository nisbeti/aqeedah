<p>تطبيق نظام الإسلام، وأحكامه في الدنيا والآخرة، وتضمن تحقيق العدل ورفع الظلم، وصيانة الحقوق، وبهذا استطاع الإسلام أن يضمن فعالية تطبيق أحكامه.</p>
